[project]
name = "claude-tools"
version = "0.2.0"
description = "Personal Claude Code toolkit: orchestrators and helpers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Farzad Pourbabaee", email = "mfarzad69@gmail.com" }]
dependencies = [
  "rich>=13.0",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "pyright>=1.1.380",
]

[project.scripts]
claude-tools = "claude_tools.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_tools"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
